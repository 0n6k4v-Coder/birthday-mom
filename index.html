<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A special birthday card for Mom">
    <title>Happy Birthday, Mom! 🎂</title>

    <!-- Google Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

    <!-- Main CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="site-header">
        <h1>Happy Birthday, Mom! 🎂</h1>
        <p>Have a wonderful day! ✨</p>
    </header>

    <!-- 3D STAGE -->
    <main class="stage">
        <div class="model-wrapper">
            <!-- MOM -->
            <model-viewer 
                id="model"
                src="./assets/models/asian-woman-3d-model.glb"
                alt="A cute 3D mother character"
                shadow-intensity="1"
                camera-orbit="0deg 80deg 105deg"
                min-camera-orbit="auto auto auto"
                max-camera-orbit="auto auto auto"
                disable-pan
                disable-zoom
                autoplay
                interaction-prompt="none">
            </model-viewer>

            <!-- CAT -->
            <model-viewer 
                id="cat-model"
                src="./assets/models/stylized-white-cat-3d-model.glb"
                alt="A cute 3D cat"
                shadow-intensity="1"
                camera-orbit="-5deg 84deg auto"
                min-camera-orbit="auto auto auto"
                max-camera-orbit="auto auto auto"
                disable-pan
                disable-zoom
                autoplay
                interaction-prompt="none">
            </model-viewer>

            <!-- GROUND SHADOW -->
            <div class="fake-shadow"></div>
        </div>
    </main>

    <!-- MAIL BUTTON -->
    <button class="fab-btn" id="openCardButton" type="button" title="Open Birthday Card" aria-label="Open Birthday Card">
        <span class="material-symbols-outlined">mail</span>
    </button>

    <!-- POSTCARD OVERLAY -->
    <div class="postcard-overlay" id="postcardOverlay" role="dialog" aria-modal="true" aria-label="Birthday Card">
        <div class="postcard-3d-container" id="postcard3D">
            <div class="postcard-inner">

                <!-- FRONT -->
                <section class="postcard-face postcard-front">
                    <div class="postcard-stamp">
                        <span class="material-symbols-outlined">favorite</span>
                    </div>
                    <div class="postcard-postmark"></div>
                    <div class="postcard-icon">
                        <span class="material-symbols-outlined">cake</span>
                    </div>
                    <h2>Happy Birthday!</h2>
                    <span class="postcard-divider"></span>
                    <p class="postcard-note">Wishing you a wonderful day filled with joy and smiles. 🎉</p>
                    <button class="flip-btn" id="flipToMusic" type="button">
                        Flip
                        <span class="material-symbols-outlined">flip</span>
                    </button>
                </section>

                <!-- MUSIC SIDE -->
                <section class="postcard-face postcard-back">
                    <!-- Musical Micro Elements -->
                    <span class="music-note note-one">♪</span>
                    <span class="music-note note-two">♫</span>
                    <span class="music-note note-three">♩</span>
                    <span class="music-note note-four">♪</span>

                    <!-- Notebook Lines -->
                    <div class="music-paper-lines"></div>

                    <!-- Header -->
                    <div class="music-heading">
                        <div class="music-heading-copy">
                            <span class="music-heading-label">A little song for you</span>
                            <span class="music-heading-script">just for mom ♡</span>
                        </div>
                        <span class="music-heart">
                            <span class="material-symbols-outlined">favorite</span>
                        </span>
                    </div>

                    <!-- Music Player -->
                    <div class="player-card">
                        <div class="player-art">
                            <img src="./assets/images/mom-birthday-cover.png" alt="Happy Birthday Mom album artwork">
                            <span class="player-art-label">for mom ♡</span>
                        </div>
                        
                        <div class="player-meta">
                            <h3 class="player-title">Happy Birthday, Mom</h3>
                            <p class="player-artist">A little song for you ♫</p>
                        </div>

                        <div class="music-divider">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <div class="player-progress" id="playerProgress" role="slider" aria-label="Song progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                            <div class="player-progress-fill" id="progressFill"></div>
                        </div>

                        <div class="player-times">
                            <span id="timeCurrent">0:00</span>
                            <span id="timeTotal">0:00</span>
                        </div>

                        <div class="player-controls">
                            <button class="ctrl-btn" id="restartButton" type="button" aria-label="Restart song from the beginning point">
                                <span class="material-symbols-outlined">replay</span>
                            </button>
                            <button class="player-play" id="playToggle" type="button" aria-label="Play">
                                <span class="material-symbols-outlined" id="playIcon">play_arrow</span>
                            </button>
                            <button class="ctrl-btn" id="muteButton" type="button" aria-label="Mute">
                                <span class="material-symbols-outlined" id="volumeIcon">volume_up</span>
                            </button>
                        </div>
                    </div>

                    <button class="flip-btn music-back-button" id="flipToFront" type="button">
                        <span class="material-symbols-outlined">flip</span>
                        Back to card
                    </button>
                </section>

            </div>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="birthdaySong" preload="metadata" src="./assets/audio/birthday-song.mp3"></audio>

    <!-- JavaScript -->
    <script src="./js/main.js"></script>

</body>
</html>
